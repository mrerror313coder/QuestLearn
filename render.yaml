services:
  - type: web
    name: questlearn-shadows
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMMA_API_BASE
        value: https://api.groq.com/openai/v1
      - key: GEMMA_MODEL
        value: gemma2-9b-it
      - key: GEMMA_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
